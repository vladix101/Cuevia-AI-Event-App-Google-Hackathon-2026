[project]
name = "cuevia-ai"
version = "0.1.0"
description = "Cuevia private AI service (Gemma-only inference), contract v1"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
    "numpy==2.2.6",
    "truststore==0.10.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["cuevia_ai", "cuevia_ai.prompts"]

[tool.setuptools.package-data]
"cuevia_ai.prompts" = ["*.txt"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
