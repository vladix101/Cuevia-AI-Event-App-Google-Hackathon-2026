name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm install -g firebase-tools@15.28.1
      - run: pip install -r backend/requirements-dev.txt
      - name: Contract checks
        run: python -m pytest integration -q
      - name: Backend tests (Firebase emulators)
        working-directory: backend
        run: firebase emulators:exec --config ../firebase.json --project demo-cuevia --only auth,firestore "python -m pytest -q"

  frontend:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: frontend
        run: npm ci && npm run build --if-present && npm test --if-present

  ai:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('ai/requirements.txt') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - working-directory: ai
        run: pip install -r requirements.txt && (pip install pytest && python -m pytest -q || test $? -eq 5)
